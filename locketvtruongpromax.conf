#!system=ios
#!arguments=all_friends:false,屏蔽上传按钮:false,屏蔽选段按钮:true,屏蔽Shorts按钮:false,字幕翻译语言:off,启用调试模式:false
#!arguments-desc=- Mở Gold & Tim Vàng cho toàn bộ bạn bè (all_friends): [true, false]
- Ẩn nút Upload YouTube (+): [true, false]
- Ẩn nút chọn đoạn nhạc: [true, false]
- Ẩn nút Shorts: [true, false]
- Dịch phụ đề YouTube: [vi, en, off]
- Bật Debug: [true, false]

[Rule]
# 1. Chặn QUIC (UDP 443) toàn diện cho Locket, RevenueCat, Firebase & Spotify để ép lưu lượng đi qua TCP giúp MITM bắt 100% gói tin
AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT
AND,((DOMAIN,firebaseremoteconfig.googleapis.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,api.revenuecat.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,api.locketcamera.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN-SUFFIX,locketcamera.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN-SUFFIX,spotify.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN-SUFFIX,spclient.wg.spotify.com),(PROTOCOL,UDP)),REJECT

# 2. Chặn Sentry Telemetry & Crash Logs
DOMAIN-SUFFIX,sentry.io,REJECT
DOMAIN-SUFFIX,ingest.sentry.io,REJECT

[URL Rewrite]
# Điều hướng (307 Temporary Redirect) API tạo ảnh Filter sang Cloudflare Worker chính chủ của Văn Trường
^https?:\/\/(us-central1-locket-4252a\.cloudfunctions\.net|api\.locketcamera\.com)\/generateFilteredImage https://weathered-wave-12cc.noobnopro2007.workers.dev/generateFilteredImage?module=VanTruong_VIP 307

[Header Rewrite]
# Xóa Cache / ETag trên RevenueCat (Chống lỗi 304 Not Modified)
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del x-revenuecat-etag
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del X-RevenueCat-ETag
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del if-none-match
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del If-None-Match
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del if-modified-since
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del If-Modified-Since

# Xóa Cache / ETag trên Firebase Remote Config
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del if-none-match
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del If-None-Match
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del if-modified-since
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del If-Modified-Since
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del x-goog-if-none-match

# Xóa Cache / ETag trên Locket Camera API
^https?:\/\/api\.locketcamera\.com\/.+ header-del if-none-match
^https?:\/\/api\.locketcamera\.com\/.+ header-del If-None-Match
^https?:\/\/api\.locketcamera\.com\/.+ header-del if-modified-since
^https?:\/\/api\.locketcamera\.com\/.+ header-del If-Modified-Since

# Xóa Cache / ETag trên Spotify
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(?::443)?)\/(user-customization-service\/v1\/customize|bootstrap\/v1\/bootstrap) header-del if-none-match
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(?::443)?)\/(user-customization-service\/v1\/customize|bootstrap\/v1\/bootstrap) header-del If-None-Match
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(?::443)?)\/(user-customization-service\/v1\/customize|bootstrap\/v1\/bootstrap) header-del if-modified-since
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(?::443)?)\/(user-customization-service\/v1\/customize|bootstrap\/v1\/bootstrap) header-del If-Modified-Since

[Script]
# --- TẦNG 1: XÓA HEADER CACHE 304 (TỪ REPO VANTRUONG) ---
deleteHeader_RC = type=http-request,pattern=^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers),script-path=https://raw.githubusercontent.com/truongphp/Vantruong/main/dklocketfilterv2.js,timeout=60
deleteHeader_Firebase = type=http-request,pattern=^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+,script-path=https://raw.githubusercontent.com/truongphp/Vantruong/main/dklocketfilterv2.js,timeout=60

# --- TẦNG 2: MỞ KHÓA LOCKET GOLD & FILTER PACKS (REVENUECAT) ---
revenuecat = type=http-response,pattern=^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers),script-path=https://raw.githubusercontent.com/truongphp/Vantruong/main/locketgold_vantruong_max.js,requires-body=true,max-size=-1,timeout=60

# --- TẦNG 3: MỞ KHÓA REMOTE CONFIG (84 FILTERS + 164 CAPTIONS + 60S VIDEO + DAILY FRAMES) ---
locket_rc = type=http-response,pattern=^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+,script-path=https://raw.githubusercontent.com/truongphp/Vantruong/main/locketremote_vantruong_max.js,requires-body=true,max-size=-1,timeout=60

# --- TẦNG 4: ENGINE AI FILTER & PHOTOBOOTH 4 Ô QUA CLOUDFLARE WORKER VĂN TRƯỜNG ---
locket_pb_req = type=http-request,pattern=^https?:\/\/(us-central1-locket-4252a\.cloudfunctions\.net|api\.locketcamera\.com)\/(generateFilteredImage|createOverlay),script-path=https://raw.githubusercontent.com/truongphp/Vantruong/main/Locketptbfilter_vantruong_max.js,requires-body=true,max-size=-1,timeout=60
locket_pb_resp = type=http-response,pattern=^https?:\/\/(weathered-wave-12cc\.noobnopro2007\.workers\.dev|locket-vip\.mhiep20077\.workers\.dev)\/(generateFilteredImage|createOverlay),script-path=https://raw.githubusercontent.com/truongphp/Vantruong/main/Locketptbfilter_vantruong_max.js,requires-body=true,max-size=-1,timeout=60

# --- TẦNG 5: MỞ KHÓA HUY HIỆU PROFILE, UNBLUR ẢNH & MẠNG LƯỚI VIP P2P ---
locket_change_profile = type=http-request,pattern=^https:\/\/api\.locketcamera\.com\/changeProfileInfo,script-path=https://raw.githubusercontent.com/truongphp/Vantruong/main/locketfiltervip_vantruong_max.js,timeout=60
locket_filter_resp = type=http-response,pattern=^https?:\/\/api\.locketcamera\.com\/.+,requires-body=true,max-size=-1,script-path=https://raw.githubusercontent.com/truongphp/Vantruong/main/locketfiltervip_vantruong_max.js,argument="all_friends={{{all_friends}}}",timeout=60

# --- TẦNG 6: YOUTUBE PREMIUM & SPOTIFY VIP (GIỮ NGUYÊN 100% KHÔNG LƯỢC BỎ) ---
youtube.response = type=http-response,pattern=^https:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config))(\?(.*))?$,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://locket-vip.mhiep20077.workers.dev/js/youtube.response.js,argument="{"captionLang":"{{{字幕翻译语言}}}","blockUpload":{{{屏蔽上传按钮}}},"blockImmersive":{{{屏蔽选段按钮}}},"blockShorts":{{{屏蔽Shorts按钮}}},"debug":{{{启用调试模式}}}}"
youtube.request.init = type=http-request,pattern=^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&ack.*,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://locket-vip.mhiep20077.workers.dev/js/youtube.request.js,argument="{"captionLang":"{{{字幕翻译语言}}}"}"
youtube.request.log_event = type=http-request,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://locket-vip.mhiep20077.workers.dev/js/youtube.request.js

spotify-json = type=http-request,pattern=^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(?::443)?)\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/,requires-body=0,script-path=https://locket-vip.mhiep20077.workers.dev/Spotify-Rules/js/spotify-json.js
spotify-proto = type=http-response,pattern=^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(?::443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize),requires-body=1,binary-body-mode=1,max-size=0,script-path=https://locket-vip.mhiep20077.workers.dev/Spotify-Rules/js/spotify-proto.js,script-update-interval=0

[Host]
firebaseremoteconfigrealtime.googleapis.com = 0.0.0.0

[MITM]
hostname = %APPEND% *.googlevideo.com, youtubei.googleapis.com, api.revenuecat.com, *.revenuecat.com, firebaseremoteconfig.googleapis.com, spclient.wg.spotify.com, *spclient.spotify.com, api.locketcamera.com, *.locketcamera.com, api.locket.camera, *.locket.camera, us-central1-locket-4252a.cloudfunctions.net, weathered-wave-12cc.noobnopro2007.workers.dev, locket-vip.mhiep20077.workers.dev
